    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="five_six_seven_dance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>five_six_seven_dance</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background: #0f1115;
      margin: 0;
      min-height: 100%;
    }

    #app-loading {
      align-items: center;
      background: #0f1115;
      display: flex;
      inset: 0;
      justify-content: center;
      position: fixed;
      z-index: 9999;
    }

    #app-loading.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .loading-circle {
      animation: loading-spin 800ms linear infinite;
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      border-top-color: #ff8a3d;
      height: 48px;
      width: 48px;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <div id="app-loading" aria-label="Loading" role="status">
    <div class="loading-circle"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (!loading) {
        return;
      }
      loading.classList.add('hidden');
      window.setTimeout(function () {
        loading.remove();
      }, 180);
    });
  </script>
  
  
  <script src="flutter_bootstrap.js" async=""></script>
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer=""></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer=""></script>


</body></html>
